# Lit les secrets dans Azure Key Vault (driver CSI) et les recopie dans le Secret Kubernetes
# glycosuivi-api-secrets, injecté en variables d'environnement dans l'API.
# ${API_CLIENT_ID}, ${KEYVAULT_NAME} et ${TENANT_ID} sont remplacés par le workflow.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: glycosuivi-api
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${API_CLIENT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: mongo-connection-string
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
  secretObjects:
    - secretName: glycosuivi-api-secrets
      type: Opaque
      data:
        - objectName: mongo-connection-string
          key: Mongo__ConnectionString
        - objectName: jwt-secret
          key: Jwt__Secret
