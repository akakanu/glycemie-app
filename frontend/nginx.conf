server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de numéro de version nginx dans les réponses.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Sonde Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fichiers versionnés par Angular (nom avec empreinte) : cache long.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html et routes Angular (/historique, /mesures/...) : jamais en cache,
    # pour que chaque déploiement soit visible immédiatement.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
