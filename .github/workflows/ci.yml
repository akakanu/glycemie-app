name: CI

# Sur chaque PR : tests + construction et scan des images (rien n'est publié).
# Sur main : idem, puis publication des images dans GitHub Container Registry.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NG_CLI_ANALYTICS: "false"
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Tests
        run: dotnet test backend -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npx ng test --watch=false
      - name: Build de production
        run: npm run build

  manifests:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Valeurs fictives : on valide la structure, pas les identifiants réels.
      IMAGE_TAG: sha-0000000
      HOST: glycosuivi.canadaeast.cloudapp.azure.com
      CLUSTER_ISSUER: letsencrypt-staging
      API_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      KEYVAULT_NAME: kv-glycosuivi-ci
      TENANT_ID: 00000000-0000-0000-0000-000000000000
      LETSENCRYPT_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer kubeconform (somme de contrôle vérifiée)
        run: |
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Rendu de l'application
        run: |
          # shellcheck disable=SC2016 # ${...} volontairement entre apostrophes : envsubst les remplace
          kubectl kustomize k8s/app \
            | envsubst '${IMAGE_TAG} ${HOST} ${CLUSTER_ISSUER} ${API_CLIENT_ID} ${KEYVAULT_NAME} ${TENANT_ID}' \
            > app.yaml
          if grep -n '\${' app.yaml; then echo "Variable non remplacée" && exit 1; fi

      - name: Rendu de la plateforme
        run: |
          # shellcheck disable=SC2016 # ${...} volontairement entre apostrophes : envsubst le remplace
          set -a; source k8s/platform/versions.env; set +a
          envsubst '${LETSENCRYPT_EMAIL}' < k8s/platform/cluster-issuers.yaml > issuers.yaml
          # helm template valide aussi les valeurs contre le schéma JSON des charts.
          helm template traefik traefik --repo https://traefik.github.io/charts \
            --version "$TRAEFIK_CHART_VERSION" -n traefik -f k8s/platform/traefik-values.yaml > traefik.yaml
          helm template cert-manager cert-manager --repo https://charts.jetstack.io \
            --version "$CERT_MANAGER_VERSION" -n cert-manager -f k8s/platform/cert-manager-values.yaml > cert-manager.yaml

      - name: Validation des schémas
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            app.yaml issuers.yaml
          # Charts tiers : on ignore seulement leurs propres CRD (sans schéma publié).
          kubeconform -strict -summary -ignore-missing-schemas \
            traefik.yaml cert-manager.yaml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: Validation (sans accès à Azure)
        run: |
          for stack in bootstrap env; do
            echo "::group::$stack"
            terraform -chdir="infra/terraform/$stack" init -backend=false -input=false
            terraform -chdir="infra/terraform/$stack" validate
            echo "::endgroup::"
          done

  workflows:
    name: Workflows et scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck --version && shellcheck -x scripts/*.sh

      - name: actionlint (inclut ShellCheck sur les blocs run)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  images:
    name: Image ${{ matrix.name }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # utilisé seulement sur main, pour publier dans GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ env.PUBLISH }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan de vulnérabilités (Trivy)
        # Échoue sur toute faille CRITIQUE pour laquelle un correctif existe.
        env:
          SCAN_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            "$TRIVY_IMAGE" image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress \
            "$SCAN_TAG"

      - name: Connexion à GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
        run: |
          echo "### Image $NAME publiée" >> "$GITHUB_STEP_SUMMARY"
          # Un tag par ligne dans la sortie de metadata-action.
          while read -r tag; do
            [[ -z "$tag" ]] && continue
            docker push "$tag"
            echo "- $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
