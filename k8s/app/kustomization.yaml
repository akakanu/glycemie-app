# Rendu : kubectl kustomize k8s/app | envsubst '<variables>' | kubectl apply -f -
# Variables remplacées par le workflow : ${IMAGE_TAG}, ${HOST}, ${CLUSTER_ISSUER},
# ${API_CLIENT_ID}, ${KEYVAULT_NAME}, ${TENANT_ID}.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glycosuivi

labels:
  - pairs:
      app.kubernetes.io/part-of: glycosuivi

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml

images:
  - name: ghcr.io/akakanu/glycemie-app/api
    newTag: ${IMAGE_TAG}
  - name: ghcr.io/akakanu/glycemie-app/web
    newTag: ${IMAGE_TAG}
